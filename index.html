<!DOCTYPE html>
<html>

<head>
  <title>Ranking Tool</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background: #111;
      color: white;
      font-family: Arial;
      padding: 30px;
      max-width: 860px;
      margin: 0 auto;
    }

    h2 {
      font-size: 36px;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #888;
      margin-bottom: 28px;
      font-size: 14px;
    }

    .section-card {
      background: #181818;
      border: 1px solid #333;
      border-radius: 14px;
      margin-bottom: 28px;
      overflow: hidden;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #222;
      padding: 14px 20px;
      border-bottom: 1px solid #333;
    }

    .section-title {
      font-size: 15px;
      font-weight: bold;
      color: #ffcc00;
      letter-spacing: 0.04em;
    }

    .section-range {
      font-size: 13px;
      color: #888;
      margin-left: 10px;
    }

    .btn-remove-section {
      background: none;
      border: 1px solid #555;
      color: #aaa;
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      margin-top: 0;
    }

    .btn-remove-section:hover {
      background: #ff444422;
      border-color: #ff4444;
      color: #ff6666;
    }

    .section-items {
      padding: 16px 20px 4px;
    }

    .item {
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      padding: 16px 20px;
      border-radius: 10px;
      margin-bottom: 14px;
      position: relative;
    }

    .item-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .item-header h3 {
      margin: 0;
      font-size: 14px;
      color: #ccc;
      font-weight: normal;
    }

    .btn-remove-item {
      background: none;
      border: none;
      color: #666;
      font-size: 20px;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
      margin-top: 0;
    }

    .btn-remove-item:hover {
      color: #ff6666;
    }

    .fields-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .field-full {
      grid-column: 1 / -1;
    }

    label.field-label {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input[type="text"],
    input[type="number"],
    input[type="file"],
    input[type="color"],
    textarea {
      display: block;
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #111;
      color: white;
      font-size: 14px;
      font-family: Arial;
    }

    input[type="color"] {
      height: 40px;
      padding: 4px;
      cursor: pointer;
    }

    input[type="number"] {
      width: 120px;
    }

    textarea {
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: #ffcc00;
    }

    .section-actions {
      display: flex;
      gap: 10px;
      padding: 0 20px 16px;
    }

    .btn-add-item {
      background: #2a2a2a;
      border: 1px solid #444;
      color: #ccc;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      margin-top: 0;
    }

    .btn-add-item:hover {
      background: #333;
    }

    .top-actions {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .btn-add-section {
      background: #ffcc00;
      color: black;
      border: none;
      padding: 12px 22px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 0;
    }

    .btn-add-section:hover {
      opacity: 0.9;
    }

    .btn-render {
      background: #00cc66;
      color: black;
      border: none;
      padding: 12px 28px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 0;
    }

    .btn-render:hover {
      opacity: 0.9;
    }

    .btn-render:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      color: #888;
      font-size: 14px;
      margin-top: 10px;
    }

    .advanced-toggle {
      margin-top: 10px;
      background: none;
      border: none;
      color: #555;
      font-size: 12px;
      cursor: pointer;
      padding: 0;
      text-align: left;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .advanced-toggle:hover {
      color: #aaa;
    }

    .advanced-fields {
      display: none;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #2a2a2a;
    }

    .advanced-fields.open {
      display: block;
    }

    .advanced-fields .fields-row {
      margin-top: 0;
      margin-bottom: 12px;
    }

    .advanced-fields input[type="number"] {
      width: 100%;
    }
  </style>
</head>

<body>

  <h2>Ranking Video Tool</h2>
  <p class="subtitle">Create sections of ranking items (ranks 1–100). Each section becomes a segment in the final video,
    connected by fade transitions.</p>

  <div class="top-actions">
    <button class="btn-add-section" type="button" onclick="addSection()">+ Add Section</button>
    <button class="btn-render" type="button" id="renderBtn" onclick="submitRender()">Render Video</button>
    <!-- Hidden native file input -->
    <input type="file" id="importCsvFileInput" accept=".csv" style="display: none;" onchange="handleCsvImport(event)">

    <!-- Clean UI Button that triggers the file input -->
    <button id="importCsvBtn" onclick="document.getElementById('importCsvFileInput').click()">Import Data from
      Excel</button>
  </div>

  <div id="sections"></div>

  <p id="status"></p>

  <script>
    let sectionCount = 0;
    let itemCounters = {};

    function getLastSectionMinRank() {
      const sectionDivs = document.querySelectorAll(".section-card");
      if (!sectionDivs.length) return null;
      const lastSection = sectionDivs[sectionDivs.length - 1];
      const rankInputs = lastSection.querySelectorAll(".rank-input");
      let min = Infinity;
      rankInputs.forEach(inp => {
        const v = parseInt(inp.value, 10);
        if (!isNaN(v)) min = Math.min(min, v);
      });
      return min === Infinity ? null : min;
    }

    function addSection(startRank) {
      const container = document.getElementById("sections");
      sectionCount++;
      const sid = sectionCount;

      if (startRank === undefined) {
        const prevMin = getLastSectionMinRank();
        startRank = prevMin !== null ? prevMin - 1 : 10;
      }

      const div = document.createElement("div");
      div.className = "section-card";
      div.dataset.sid = sid;

      div.innerHTML = `
        <div class="section-header">
          <div>
            <span class="section-title">Section ${sid}</span>
            <span class="section-range" id="range-${sid}"></span>
          </div>
          <button class="btn-remove-section" type="button" onclick="removeSection(${sid})">Remove Section</button>
        </div>
        <div class="section-items" id="items-${sid}"></div>
        <div class="section-actions">
          <button class="btn-add-item" type="button" onclick="addItem(${sid})">+ Add Item</button>
        </div>
      `;

      container.appendChild(div);
      addItem(sid, startRank);
    }

    function removeSection(sid) {
      const el = document.querySelector(`.section-card[data-sid="${sid}"]`);
      if (el) el.remove();
    }

    function addItem(sid, rank) {
      const container = document.getElementById(`items-${sid}`);
      if (!container) return;

      if (!itemCounters[sid]) itemCounters[sid] = 0;
      itemCounters[sid]++;
      const localNum = itemCounters[sid];

      if (rank === undefined) {
        const existing = container.querySelectorAll(".rank-input");
        let min = Infinity;
        existing.forEach(inp => {
          const v = parseInt(inp.value, 10);
          if (!isNaN(v)) min = Math.min(min, v);
        });
        rank = min !== Infinity ? min - 1 : (getLastSectionMinRank() || 10);
      }

      const iid = `${sid}_${localNum}`;
      const div = document.createElement("div");
      div.className = "item";
      div.dataset.iid = iid;

      div.innerHTML = `
        <div class="item-header">
          <h3>Item ${localNum}</h3>
          <button class="btn-remove-item" type="button" onclick="removeItem('${iid}')" title="Remove">×</button>
        </div>
        <div class="fields-row">
          <div class="field-full">
            <label class="field-label">Image</label>
            <input type="file" accept="image/*" class="image-input" />
          </div>

      <div class="field-full">
  <label class="field-label">Removed Background Image (Optional)</label>
  <input type="file" accept="image/*" class="removed-bg-input" />
</div>
          <div>
            <label class="field-label">Name</label>
            <input type="text" placeholder="Character name" class="name-input" />
          </div>
          <div>
            <label class="field-label">Rank</label>
            <input type="number" min="1" max="100" value="${rank}" class="rank-input" oninput="updateSectionHeader(${sid})" />
          </div>
          <div>
            <label class="field-label">Title (shown in RANK box)</label>
            <input type="text" placeholder="e.g. Best Villain" class="title-input" />
          </div>
          <div>
            <label class="field-label">Image Label (e.g. Survival Rate: 5%)</label>
            <input type="text" placeholder="e.g. Human survival change: 5%" class="orig-label-input" />
          </div>
          <div>
            <label class="field-label">Containment Level</label>
            <input type="text" placeholder="e.g. Easy, High Risk, Impossible" class="containment-input" />  
          </div>
          <div>
            <label class="field-label">Icon (image, optional)</label>
            <input type="file" accept="image/*" class="icon-input" />
          </div>
          <div class="field-full">
            <label class="field-label">Description (shown in RANK box)</label>
            <textarea class="desc-input" rows="2" placeholder="Short description..."></textarea>
          </div>
          
        </div>
        <button class="advanced-toggle" type="button" onclick="toggleAdvanced('${iid}')">▸ Advanced</button>
        <div class="advanced-fields" id="adv-${iid}">
          <div class="fields-row">
            <div>
              <label class="field-label">Silhouette offset (px)</label>
              <input type="number" value="0" class="sil-offset-input" placeholder="0" />
              <span style="font-size:11px;color:#666;display:block;margin-top:4px">negative = lower, positive = higher</span>
            </div>
            <div>
              <label class="field-label">Original image scale (%)</label>
              <input type="number" value="100" min="10" max="300" class="orig-scale-input" placeholder="100" />
              <span style="font-size:11px;color:#666;display:block;margin-top:4px">100 = default size</span>
            </div>
          </div>
          <div class="fields-row">
            <div class="field-full">
              <label class="field-label">District Level (Subtitle) Color</label>
              <input type="color" value="#ffffff" class="subtitle-color-input" />
            </div>
          </div>
        </div>
      `;

      container.appendChild(div);
      updateSectionHeader(sid);
    }

    function handleCsvImport(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (e) {
        const text = e.target.result;

        // 1. Parse CSV lines while respecting quotes
        const rows = parseCsvText(text);
        if (rows.length <= 1) {
          alert("The uploaded file seems to be empty or missing headers.");
          return;
        }

        const headers = rows[0].map(h => h.trim().toLowerCase());

        // Map headers to their column positions
        const idxOrigLabel = headers.indexOf("image label");
        const idxSection = headers.indexOf("section index");
        const idxRank = headers.indexOf("rank");
        const idxName = headers.indexOf("name");
        const idxTitle = headers.indexOf("title");
        const idxDesc = headers.indexOf("description");
        const idxColor = headers.indexOf("district color");

        if (idxName === -1 || idxTitle === -1) {
          alert("Invalid template! Make sure your columns contain at least 'Name' and 'Title'.");
          return;
        }

        // 2. Rebuild the sections data structure
        const importedSectionsMap = {};

        for (let i = 1; i < rows.length; i++) {
          const row = rows[i];
          if (row.length < 2 || !row[idxName]) continue; // Skip empty rows

          // Group by section identifier (e.g., "Section 1", "Section 2")
          const sectionName = idxSection !== -1 && row[idxSection] ? row[idxSection].trim() : "Section 1";

          if (!importedSectionsMap[sectionName]) {
            importedSectionsMap[sectionName] = { items: [] };
          }

          // Build individual item block properties
          importedSectionsMap[sectionName].items.push({
                  rank: idxRank !== -1 ? parseInt(row[idxRank]) || 0 : 0,
                  name: row[idxName] || "",
                  title: row[idxTitle] || "",
                  description: idxDesc !== -1 ? row[idxDesc] : "",
                  subtitleColor: idxColor !== -1 && row[idxColor] ? row[idxColor] : "#FFFFFF",
                  origLabel: idxOrigLabel !== -1 && row[idxOrigLabel] ? row[idxOrigLabel] : "", // <-- ADD THIS LINE
                  imageFile: null,
                  removedBgFile: null,
                  iconFile: null
                });
        }

        // Convert the map back into a flat layout array
        window.sections = Object.values(importedSectionsMap);

        // 3. Trigger your UI redraw function
        // 3. Clear existing UI and inject parsed template data instantly
        document.getElementById("sections").innerHTML = ""; // Clear default starting cards
        sectionCount = 0; // Reset global tracking counters
        itemCounters = {};

        // Loop through and construct each parsed section
        window.sections.forEach((section, index) => {
          const sid = index + 1;

          // Re-initialize section template shell container elements
          addSection();

          // The default addSection() helper adds a clean baseline item structure. 
          // We empty it so we can push our explicit CSV table entries accurately.
          document.getElementById(`items-${sid}`).innerHTML = "";
          itemCounters[sid] = 0;

          // Step through your item property states and assign values directly into UI nodes
          section.items.forEach((item) => {
            addItem(sid, item.rank);

            // Track dynamic incremental index bindings generated inside the DOM instance
            const currentLocalNum = itemCounters[sid];
            const itemContainer = document.querySelector(`.item[data-iid="${sid}_${currentLocalNum}"]`);

            if (itemContainer) {
              itemContainer.querySelector(".name-input").value = item.name;
              itemContainer.querySelector(".title-input").value = item.title;
              itemContainer.querySelector(".desc-input").value = item.description;
              itemContainer.querySelector(".orig-label-input").value = item.origLabel || "";

              // Convert Hex 0x format seamlessly back into standard browser Color Picker string syntax
              const pickerColor = item.subtitleColor.startsWith("0x")
                ? item.subtitleColor.replace("0x", "#")
                : item.subtitleColor;

              itemContainer.querySelector(".subtitle-color-input").value = pickerColor;
            }
          });

          updateSectionHeader(sid);
        });

        alert("Data imported successfully! All slots are filled. You can now select your image files.");
      };

      reader.readAsText(file);
      // Reset file input value so users can upload the same file again if edited
      event.target.value = "";
    }

    // Robust helper function to handle commas embedded inside quotes safely
    function parseCsvText(text) {
      const lines = [];
      let row = [""];
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        const next = text[i + 1];

        if (c === '"') {
          if (inQuotes && next === '"') { row[row.length - 1] += '"'; i++; } // Handled double quotes
          else { inQuotes = !inQuotes; }
        } else if (c === ',' && !inQuotes) {
          row.push('');
        } else if ((c === '\r' || c === '\n') && !inQuotes) {
          if (c === '\r' && next === '\n') { i++; }
          lines.push(row);
          row = [''];
        } else {
          row[row.length - 1] += c;
        }
      }
      if (row.length > 1 || row[0] !== '') lines.push(row);
      return lines;
    }

    function toggleAdvanced(iid) {
      const panel = document.getElementById(`adv-${iid}`);
      const btn = panel.previousElementSibling;
      const open = panel.classList.toggle("open");
      btn.textContent = (open ? "▾" : "▸") + " Advanced";
    }

    function removeItem(iid) {
      const el = document.querySelector(`.item[data-iid="${iid}"]`);
      if (!el) return;
      const sid = parseInt(iid.split("_")[0], 10);
      el.remove();
      updateSectionHeader(sid);
    }

    function updateSectionHeader(sid) {
      const container = document.getElementById(`items-${sid}`);
      const rangeEl = document.getElementById(`range-${sid}`);
      if (!container || !rangeEl) return;
      const ranks = [];
      container.querySelectorAll(".rank-input").forEach(inp => {
        const v = parseInt(inp.value, 10);
        if (!isNaN(v)) ranks.push(v);
      });
      if (!ranks.length) {
        rangeEl.textContent = "";
      } else {
        maxR = Math.max(...ranks);
        minR = Math.min(...ranks);
        rangeEl.textContent = maxR === minR ? `— Rank ${maxR}` : `— Ranks ${maxR} → ${minR}`;
      }
    }

    async function submitRender() {
      const sectionDivs = document.querySelectorAll(".section-card");
      if (!sectionDivs.length) {
        alert("Add at least one section with items.");
        return;
      }

      const formData = new FormData();
      const sectionsPayload = [];
      let globalItemIndex = 0;
      let totalImages = 0;

      sectionDivs.forEach(secDiv => {
        const sectionItems = [];
        secDiv.querySelectorAll(".item").forEach(div => {
          const imageInput = div.querySelector(".image-input");
          if (!imageInput || !imageInput.files[0]) return;

          formData.append("images", imageInput.files[0]);

          const iconInput = div.querySelector(".icon-input");
          if (iconInput && iconInput.files[0]) {
            formData.append(`icon_${globalItemIndex}`, iconInput.files[0]);
          }

          const removedBgInput = div.querySelector(".removed-bg-input");
          if (removedBgInput && removedBgInput.files[0]) {
            formData.append(`removedBg_${globalItemIndex}`, removedBgInput.files[0]);
          }

          const subColor = div.querySelector(".subtitle-color-input")?.value || "#ffffff";

          sectionItems.push({
            name: (div.querySelector(".name-input")?.value.trim()) || "Unnamed",
            title: (div.querySelector(".title-input")?.value.trim()) || "",
            description: (div.querySelector(".desc-input")?.value.trim()) || "",
            origLabel: (div.querySelector(".orig-label-input")?.value.trim()) || "",
            containment: (div.querySelector(".containment-input")?.value.trim()) || "Unknown",
            rank: parseInt(div.querySelector(".rank-input")?.value, 10) || 1,
            silOffset: parseInt(div.querySelector(".sil-offset-input")?.value, 10) || 0,
            origScale: parseFloat(div.querySelector(".orig-scale-input")?.value) || 100,
            subtitleColor: subColor.replace("#", "0x")
          });

          globalItemIndex++;
          totalImages++;
        });

        if (sectionItems.length) sectionsPayload.push({ items: sectionItems });
      });

      if (!totalImages) {
        alert("Add at least one image.");
        return;
      }

      formData.append("sections", JSON.stringify(sectionsPayload));

      const renderBtn = document.getElementById("renderBtn");
      const status = document.getElementById("status");
      renderBtn.disabled = true;
      const sWord = sectionsPayload.length === 1 ? "section" : "sections";
      status.textContent = `Rendering ${sectionsPayload.length} ${sWord} (${totalImages} items total)…`;

      try {
        const response = await fetch("/render", { method: "POST", body: formData });
        const data = await response.json();

        if (!response.ok || !data.success) {
          status.textContent = "Render failed.";
          alert("ERROR: " + (data.error || "Unknown error"));
          return;
        }

        status.textContent = "Render complete!";
        alert("Render complete!");
        window.open(data.url || ("/" + data.video), "_blank");

      } catch (err) {
        console.error(err);
        status.textContent = "Render failed — check server is running.";
        alert("Render failed: " + err.message);
      } finally {
        renderBtn.disabled = false;
      }
    }

    addSection(10);
  </script>

</body>

</html>
